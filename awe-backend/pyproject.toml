[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awe-backend"
version = "0.1.0"
description = "Web API and application services for AWE"
requires-python = ">=3.11"
dependencies = [
  "docker",
  "cryptography",
  "fastapi",
  "itsdangerous",
  "httpx",
  "pwdlib[argon2]",
  "pymongo",
  "pydantic-settings",
  "uvicorn[standard]",
  "websockets",
  "playwright",
  "python-multipart",
  "asyncssh",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
  "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["awe_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

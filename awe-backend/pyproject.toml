[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awe-backend"
version = "0.1.0"
description = "Web API and application services for AWE"
requires-python = ">=3.11"
dependencies = [
  "docker>=7,<8",
  "cryptography>=42,<47",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "httpx>=0.27,<1",
  "pwdlib[argon2]>=0.3,<1",
  "pymongo>=4.6,<5",
  "pydantic-settings>=2.4,<3",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<16",
  "playwright>=1.50,<2",
  "python-multipart>=0.0.9,<1",
  "asyncssh>=2.17,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["awe_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

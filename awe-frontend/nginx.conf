server {
    listen 4000;
    server_name _;
    root /usr/share/nginx/html;

    # Compress API payloads on the direct :4000 path; browsers transparently
    # decompress gzip before fetch() exposes response.json()/response.text().
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/javascript application/xml image/svg+xml text/css text/plain text/xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # The service worker must revalidate every load so updates roll out promptly.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # HTML must always point at the bundles from the current deployment.
    location = /index.html {
        add_header Cache-Control "no-store, max-age=0";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-store, max-age=0";
        try_files /index.html =404;
    }

    # A missing hashed bundle must be a 404, never the SPA HTML fallback.
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
